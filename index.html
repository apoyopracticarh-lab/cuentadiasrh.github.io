<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora Días Hábiles</title>
<style>
body { font-family: Arial; padding:20px; background:#f5f5f5 }
.card { background:#fff; padding:20px; border-radius:10px; max-width:600px; margin:auto }
input { padding:8px; margin:5px; }
button { padding:10px; cursor:pointer }
table { width:100%; border-collapse:collapse; margin-top:15px }
th, td { border:1px solid #ccc; padding:8px; text-align:center }
th { background:#2A5C45; color:#fff }
.hab { color:green; font-weight:bold }
.inhab { color:red; font-weight:bold }
</style>
</head>

<body>

<div class="card">
<h2>Calculadora Días Hábiles</h2>

<input type="date" id="fechaInicio">
<input type="date" id="fechaFin">
<button onclick="calcular()">Calcular</button>

<div id="resultado"></div>
</div>

<script>
// ─────────────────────────────
// PARSE FECHA SEGURO
// ─────────────────────────────
function parseFechaTexto(txt) {
  const m = txt.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})$/);
  if (!m) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

// ─────────────────────────────
// EXTRAER 2 FECHAS EXACTAS
// ─────────────────────────────
function extraerFechasDeLinea(linea) {
  const matches = linea.match(/\d{2}[-\/]\d{2}[-\/]\d{4}/g);
  if (!matches || matches.length < 2) return null;

  return [
    parseFechaTexto(matches[0]),
    parseFechaTexto(matches[1])
  ];
}

// ─────────────────────────────
// PEGADO DESDE EXCEL (CORRECTO)
// ─────────────────────────────
document.addEventListener("paste", function(e) {
  const texto = e.clipboardData.getData("text").trim();

  const filas = texto.split(/\r?\n/).filter(f => f.trim());
  const resultados = [];

  filas.forEach(fila => {
    const fechas = extraerFechasDeLinea(fila);
    if (!fechas) return;

    const [inicio, fin] = fechas;

    const calc = calcularRango(inicio, fin);
    if (calc) {
      resultados.push({ inicio, fin, ...calc });
    }
  });

  if (resultados.length === 0) return;

  e.preventDefault();

  // SOLO UNA FILA → comportamiento normal
  if (resultados.length === 1) {
    fechaInicio.value = resultados[0].inicio;
    fechaFin.value = resultados[0].fin;
    mostrarResultadoIndividual(resultados[0]);
    return;
  }

  // MULTIPLES FILAS → tabla
  mostrarTablaResultados(resultados);
});

// ─────────────────────────────
// CALCULO (CORREGIDO)
// ─────────────────────────────
function calcularRango(inicio, fin) {
  const d1 = new Date(inicio + "T00:00:00");
  const d2 = new Date(fin + "T00:00:00");

  if (d2 < d1) return null;

  const feriados = buildHolidayMap(d1.getFullYear(), d2.getFullYear());

  let habiles = 0;
  let inhabiles = 0;

  let d = new Date(d1);
  while (d <= d2) {
    const dow = d.getDay();
    const isWeekend = (dow === 0 || dow === 6);
    const isFeriado = feriados[fmtKey(d)];

    if (isWeekend || isFeriado) inhabiles++;
    else habiles++;

    d.setDate(d.getDate() + 1);
  }

  return {
    total: habiles + inhabiles,
    habiles,
    inhabiles
  };
}

// ─────────────────────────────
// RESULTADO INDIVIDUAL
// ─────────────────────────────
function mostrarResultadoIndividual(r) {
  resultado.innerHTML = `
    <p><b>${r.total} días</b></p>
    <p style="color:green">${r.habiles} hábiles</p>
    <p style="color:red">${r.inhabiles} inhábiles</p>
  `;
}

// ─────────────────────────────
// TABLA MULTIPLE DETALLADA
// ─────────────────────────────
function mostrarTablaResultados(data) {
  const rows = data.map(r => `
    <tr>
      <td>${r.inicio}</td>
      <td>${r.fin}</td>
      <td><b>${r.total} días</b></td>
      <td style="color:green">${r.habiles}</td>
      <td style="color:red">${r.inhabiles}</td>
    </tr>
  `).join('');

  resultado.innerHTML = `
    <table>
      <tr>
        <th>Inicio</th>
        <th>Fin</th>
        <th>Total</th>
        <th>Hábiles</th>
        <th>Inhábiles</th>
      </tr>
      ${rows}
    </table>
  `;
}

// INIT
const hoy=new Date();
const fin=new Date(); fin.setDate(hoy.getDate()+7);

fechaInicio.value=hoy.toISOString().split('T')[0];
fechaFin.value=fin.toISOString().split('T')[0];

</script>

</body>
</html>
