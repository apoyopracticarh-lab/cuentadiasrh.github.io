<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora Días Hábiles</title>
<style>
body { font-family: Arial; padding:20px; background:#f5f5f5 }
.card { background:#fff; padding:20px; border-radius:10px; max-width:600px; margin:auto }
input { padding:8px; margin:5px; }
button { padding:10px; cursor:pointer }
table { width:100%; border-collapse:collapse; margin-top:15px }
th, td { border:1px solid #ccc; padding:8px; text-align:center }
th { background:#2A5C45; color:#fff }
.hab { color:green; font-weight:bold }
.inhab { color:red; font-weight:bold }
</style>
</head>

<body>

<div class="card">
<h2>Calculadora Días Hábiles</h2>

<input type="date" id="fechaInicio">
<input type="date" id="fechaFin">
<button onclick="calcular()">Calcular</button>

<div id="resultado"></div>
</div>

<script>
// ─────────────────────────────────────────────
// PARSE FECHA (Excel)
// ─────────────────────────────────────────────
function parseFechaTexto(txt) {
  const m = txt.match(/(\d{2})[-\/](\d{2})[-\/](\d{4})/);
  if (!m) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

// ─────────────────────────────────────────────
// PEGADO DESDE EXCEL (MULTI FILA)
// ─────────────────────────────────────────────
document.addEventListener("paste", function(e) {
  const texto = e.clipboardData.getData("text");
  const filas = texto.split(/\r?\n/).filter(f => f.trim());

  const regex = /\d{2}[-\/]\d{2}[-\/]\d{4}/g;
  const resultados = [];

  filas.forEach(fila => {
    const m = fila.match(regex);
    if (!m || m.length < 2) return;

    const f1 = parseFechaTexto(m[0]);
    const f2 = parseFechaTexto(m[1]);
    if (!f1 || !f2) return;

    const calc = calcularRango(f1, f2);
    if (calc) resultados.push({inicio:f1, fin:f2, ...calc});
  });

  if (resultados.length === 1) {
    e.preventDefault();
    fechaInicio.value = resultados[0].inicio;
    fechaFin.value = resultados[0].fin;
    calcular();
  }

  if (resultados.length > 1) {
    e.preventDefault();
    mostrarTabla(resultados);
  }
});

// ─────────────────────────────────────────────
// FERIADOS CHILE
// ─────────────────────────────────────────────
function fmtKey(d){
  return d.toISOString().split('T')[0];
}

function getEaster(y){
  const a=y%19,b=Math.floor(y/100),c=y%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(y,month-1,day);
}

function getFeriados(y){
  const h = {};
  const add = (d)=>h[fmtKey(d)]=true;

  [[1,1],[5,1],[5,21],[7,16],[8,15],[9,18],[9,19],[10,31],[11,1],[12,8],[12,25]]
  .forEach(([m,d])=>add(new Date(y,m-1,d)));

  const easter = getEaster(y);
  const vs=new Date(easter); vs.setDate(easter.getDate()-2);
  add(vs);

  return h;
}

function buildHolidayMap(y1,y2){
  const map={};
  for(let y=y1;y<=y2;y++){
    Object.assign(map,getFeriados(y));
  }
  return map;
}

// ─────────────────────────────────────────────
// CALCULO
// ─────────────────────────────────────────────
function calcularRango(inicio,fin){
  const d1=new Date(inicio), d2=new Date(fin);
  if(d2<d1) return null;

  const feriados=buildHolidayMap(d1.getFullYear(),d2.getFullYear());

  let hab=0, inh=0;

  let d=new Date(d1);
  while(d<=d2){
    const dow=d.getDay();
    const isWeekend=(dow===0||dow===6);
    const isFeriado=feriados[fmtKey(d)];

    if(isWeekend || isFeriado) inh++;
    else hab++;

    d.setDate(d.getDate()+1);
  }

  return {total:hab+inh, habiles:hab, inhabiles:inh};
}

function calcular(){
  const i=fechaInicio.value;
  const f=fechaFin.value;

  const r=calcularRango(i,f);
  if(!r) return;

  resultado.innerHTML=`
    <p><b>Total:</b> ${r.total}</p>
    <p class="hab">Hábiles: ${r.habiles}</p>
    <p class="inhab">Inhábiles: ${r.inhabiles}</p>
  `;
}

// ─────────────────────────────────────────────
// TABLA MULTIPLE
// ─────────────────────────────────────────────
function mostrarTabla(data){
  const rows=data.map(d=>`
    <tr>
      <td>${d.inicio}</td>
      <td>${d.fin}</td>
      <td>${d.total}</td>
      <td class="hab">${d.habiles}</td>
      <td class="inhab">${d.inhabiles}</td>
    </tr>
  `).join('');

  resultado.innerHTML=`
    <h3>Resultados múltiples</h3>
    <table>
      <tr>
        <th>Inicio</th><th>Fin</th><th>Total</th><th>Hábiles</th><th>Inhábiles</th>
      </tr>
      ${rows}
    </table>
  `;
}

// INIT
const hoy=new Date();
const fin=new Date(); fin.setDate(hoy.getDate()+7);

fechaInicio.value=hoy.toISOString().split('T')[0];
fechaFin.value=fin.toISOString().split('T')[0];

</script>

</body>
</html>
